<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bodybuilding news, results, events and predictions for Kuwait and the Gulf.">
<meta name="theme-color" content="#09090A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BB365">
<script>window.BB_HOSTED=true</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{padding-top:env(safe-area-inset-top,0px);background:#09090A}@supports (height:100dvh){html,body{height:100dvh}}</style>
</head>
<body>
<title>BB365</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-sized app frame, centered on desktop, edge to edge on phones.
   Look: black and gold, photography first, athletic condensed display type. */
:root{
  --ink:#09090A; --s1:#111113; --s2:#18181B; --s3:#222226; --line:#2B2B30;
  --gold:#D6B04C; --gold-2:#F1D888; --gold-3:#8C6D1B;
  --text:#F4F3EF; --muted:#9B9BA4; --ok:#3ED598; --bad:#FF6B6B;
  --display:"Barlow Condensed","Noto Kufi Arabic","Arial Narrow",Impact,sans-serif;
  --body:Inter,"Noto Kufi Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#050506;color:var(--text);font-family:var(--body);font-size:14px;display:flex;align-items:center;justify-content:center;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3,p,dl,dd{margin:0}
ul{margin:0;padding:0;list-style:none}
img{display:block}
#phone{position:relative;width:410px;max-width:100%;height:100%;max-height:880px;background:var(--ink);border-radius:38px;border:1px solid #2A2A30;overflow:hidden;box-shadow:0 24px 90px #000}
#view{position:absolute;inset:0;display:flex;flex-direction:column}
@media (max-width:480px){#phone{width:100%;max-height:none;border-radius:0;border:0;box-shadow:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:26px;padding-bottom:28px}
.scroll>*{flex:none}
.pc-title{overflow-wrap:anywhere}
[data-focus]:focus{outline:none}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.row{display:flex;align-items:center}.g8{gap:8px}.g12{gap:12px}
.muted{color:var(--muted)}
.disp{font-family:var(--display)}
.num{font-variant-numeric:tabular-nums}

/* top bars + section heads */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0}
.logo{font-family:var(--display);font-weight:800;font-style:italic;font-size:34px;line-height:1;letter-spacing:.02em;color:var(--gold)}
.title{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.ibtn{position:relative;width:44px;height:44px;border-radius:22px;background:var(--s2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text)}
.ibtn.glass{background:rgba(9,9,10,.55);border-color:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.badge-dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:4px;background:var(--bad)}
.sec{display:flex;flex-direction:column;gap:12px;padding:0 20px}
.sec-h{display:flex;align-items:center;justify-content:space-between}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.03em}
.link{color:var(--gold);font-weight:600;font-size:13px;min-height:44px;display:flex;align-items:center}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 20px 2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{flex:none;scroll-snap-align:start}

/* chips, buttons, progress */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.1);color:#E4E4EA;white-space:nowrap}
.chip.ok{background:rgba(62,213,152,.16);color:var(--ok)}
.chip.live{background:rgba(255,107,107,.16);color:#FF8F8F}
.chip.gold{background:rgba(214,176,76,.18);color:var(--gold-2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{min-height:50px;padding:0 20px;border-radius:14px;border:0;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,#B8902B);color:#1A1405}
.btn.line{background:transparent;border:1px solid #3A3A41;color:var(--text)}
.btn.glass{background:rgba(255,255,255,.12);color:var(--text);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.sm{min-height:44px;padding:0 16px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold-2),var(--gold))}

/* photo cards */
.pc{position:relative;display:block;border-radius:22px;overflow:hidden;background:var(--s2);isolation:isolate}
.pc>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.pc::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,9,10,.12) 0%,rgba(9,9,10,.5) 52%,rgba(9,9,10,.95) 100%)}
.pc-body{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;height:100%;padding:16px}
.pc-title{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase}
.pc-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:#D8D8DE}
.ph{position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 50% 30%,#3B2F10,#14120B 70%);display:flex;align-items:flex-end;justify-content:center}
.ph svg{width:100%;height:92%;opacity:.9}

/* surfaces */
.card{background:var(--s2);border:1px solid var(--line);border-radius:18px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:18px;background:var(--s2);border:1px solid var(--line);font-size:12px;font-weight:600;text-align:center;min-height:44px}
.tile .ico{width:44px;height:44px;border-radius:14px;background:rgba(214,176,76,.14);color:var(--gold);display:flex;align-items:center;justify-content:center}

/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:rgba(17,17,19,.97);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:10px;font-weight:600;color:#8D8D96}
.tabbar a.on{color:var(--gold)}
.tabbar a.on::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:2px;background:var(--gold)}

/* hero + detail headers */
.cover{position:relative;flex:none;isolation:isolate;overflow:hidden}
.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.cover::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,9,10,.5) 0%,rgba(9,9,10,.05) 30%,rgba(9,9,10,.97) 100%)}
.cover-top{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;background:var(--s2);border:1px solid var(--line)}
.fact span{font-size:12px;color:var(--muted)}
.fact b{font-size:15px;font-weight:700}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 20px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--s2);color:#DADAE0;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#1A1405}
.cta{flex:none;display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(17,17,19,.98);border-top:1px solid var(--line)}
.rowcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--s2);border:1px solid var(--line)}
.medal{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-weight:700}

/* forms */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 20px}
.stepper i{height:4px;border-radius:2px;background:var(--s3)}
.stepper i.on{background:var(--gold)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:12px;font-weight:600;color:#CFCFD6}
.input{width:100%;height:50px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--text);padding:0 14px;font:inherit;font-size:16px}
.input:focus{outline:none;border-color:var(--gold)}
.input[aria-invalid=true]{border-color:var(--bad)}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:#FF8F8F}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pre{display:flex;gap:8px}.pre span{flex:none;display:flex;align-items:center;padding:0 12px;border-radius:12px;background:var(--s3);border:1px solid var(--line);font-weight:600}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--s2);border:1px solid var(--line);min-height:64px}
.opt[aria-checked=true]{border-color:var(--gold);background:rgba(214,176,76,.08)}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #4A4A52;display:flex;align-items:center;justify-content:center}
.opt[aria-checked=true] .radio{border-color:var(--gold)}
.opt[aria-checked=true] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.chk{display:flex;align-items:flex-start;gap:12px;padding:12px 0;font-size:14px;line-height:1.4}
.chk input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--gold)}
.avatar-lg{flex:none;width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--s3);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.avatar-lg img{width:100%;height:100%;object-fit:cover}
.uploader:focus-within label{outline:2px solid var(--gold-2);outline-offset:2px}
.sum{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sum:last-child{border-bottom:0}
.sum span{color:var(--muted)}.sum b{text-align:end;font-weight:600}
.pass{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#2C2310,#121214 60%);border:1px solid #4A3C16;padding:18px}
.code{height:44px;border-radius:6px;background:repeating-linear-gradient(90deg,#F4F3EF 0 2px,transparent 2px 5px,#F4F3EF 5px 6px,transparent 6px 10px,#F4F3EF 10px 13px,transparent 13px 15px);opacity:.9}
.tl{display:flex;flex-direction:column;gap:0}
.tl li{position:relative;display:flex;gap:14px;padding:0 0 18px 0}
.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .pt{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #4A4A52;display:flex;align-items:center;justify-content:center;background:var(--ink)}
.tl .done .pt{background:var(--gold);border-color:var(--gold);color:#1A1405}
.tl .now .pt{border-color:var(--gold)}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid rgba(26,20,5,.3);border-top-color:#1A1405;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* shop + clubs */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.prod{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:18px;background:var(--s2);border:1px solid var(--line);min-width:0}
.prod-img{aspect-ratio:1/1;border-radius:13px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3B2F10,#14120B 75%);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.prod-img img{width:100%;height:100%;object-fit:cover}
.price{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:var(--gold-2)}
.qty{display:flex;align-items:center;justify-content:space-between}
.qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);display:flex;align-items:center;justify-content:center}
.qty button.f{background:var(--gold);color:#1A1405}
.cartbar{flex:none;margin:0 20px 10px;min-height:54px;border-radius:16px;border:0;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1A1405;font-weight:700}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;overflow-y:auto;background:var(--s1);border-radius:26px 26px 0 0;border-top:1px solid var(--line);z-index:21;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:absolute;left:20px;right:20px;bottom:92px;z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast div{background:#F4F3EF;color:#111;font-weight:600;padding:12px 16px;border-radius:14px;box-shadow:0 8px 30px #000A;animation:up .2s}
.note{font-size:12px;color:var(--muted);line-height:1.5;text-align:center;padding:0 24px}
.view-in{animation:fade .25s}
.macro-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--s3)}
.macro-bar i{display:block;height:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.th{display:flex;justify-content:space-between;padding:0 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tick{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid #4A4A52;display:flex;align-items:center;justify-content:center;color:#1A1405}
[aria-checked=true]>.tick{background:var(--gold);border-color:var(--gold)}
.toolhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 0}
.toolhead h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;text-transform:uppercase;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* home feed */
.story{position:relative;overflow:hidden;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid #4A3C16;
  background:radial-gradient(120% 90% at 100% 0%,rgba(214,176,76,.28),transparent 55%),linear-gradient(180deg,#1A1813,#111113)}
.story .kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.story h3{margin:0;font-family:var(--display);font-weight:800;font-size:34px;line-height:.95;text-transform:uppercase}
.pod{display:flex;flex-direction:column;gap:8px}
.pod-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05)}
.pod-row.first{background:linear-gradient(90deg,rgba(214,176,76,.22),rgba(214,176,76,.05));border:1px solid rgba(214,176,76,.35)}
.pod-row .pl{font-family:var(--display);font-weight:800;font-size:22px;width:20px;text-align:center;color:var(--gold-2)}
.pod-row .pts{margin-inline-start:auto;font-family:var(--display);font-weight:700;font-size:22px}
.pod-row .pts small{font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600}
.ext{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:32px;font-size:12px;font-weight:600;color:var(--gold)}
.res{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--s2);border:1px solid var(--line)}
.res-h{display:flex;align-items:flex-start;gap:12px}
.res-ic{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(214,176,76,.14);color:var(--gold);display:flex;align-items:center;justify-content:center}
.win{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.champs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.champ{min-width:0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:2px}
.champ span{font-size:11px;color:var(--muted)}.champ b{font-size:13px;line-height:1.25}
.drama{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;border:1px solid #3A2A1E;background:linear-gradient(160deg,#21160F,#111113 62%)}
.vs{display:flex;align-items:center;gap:10px}
.vs b.n{flex:1;min-width:0;padding:11px 8px;border-radius:12px;background:rgba(255,255,255,.06);text-align:center;font-size:13px;line-height:1.2}
.vs i{flex:none;font-style:normal;font-family:var(--display);font-weight:800;font-size:16px;color:#1A1405;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--gold-2),var(--gold));box-shadow:0 0 18px rgba(214,176,76,.45)}
.news{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--s2);border:1px solid var(--line);color:var(--text)}
.news .th{flex:none;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--gold-2);background:radial-gradient(circle at 30% 20%,rgba(241,216,136,.25),rgba(214,176,76,.06))}
.news b{display:block;font-size:14px;line-height:1.3}
.news .src{font-size:11.5px;color:var(--muted);margin-top:4px}
.slim{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--s2);border:1px solid var(--line)}

/* Arabic / RTL */
#phone[dir=rtl]{--body:Inter,"Noto Sans Arabic","Noto Kufi Arabic",system-ui,sans-serif;font-family:var(--body)}
#phone[dir=rtl] *{letter-spacing:0!important}
#phone[dir=rtl] :is(.title,.pc-title,.sec-h h2,.story h3,h1,h2,h3){line-height:1.3}
#phone[dir=rtl] svg:is([data-i=chev],[data-i=back],[data-i=arrow],[data-i=ext]){transform:scaleX(-1)}
#phone[dir=rtl] .opt{text-align:right}
#phone[dir=rtl] .tl li::before{left:auto;right:11px}
#phone[dir=rtl] .sw{margin-right:0;margin-left:6px}
#phone[dir=rtl] .badge-dot{right:auto;left:11px}
#phone[dir=rtl] input:is([type=tel],[type=email],[type=number],[type=date]){direction:ltr;text-align:right}
.lang-btn{font-family:"Noto Kufi Arabic",var(--body);font-weight:800;font-size:15px;color:var(--text)}
.lang-float{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:16px;z-index:5;font-family:"Noto Kufi Arabic",var(--body);font-weight:800;font-size:15px;color:var(--text)}

/* language gate on the first screen */
.lang-gate{padding:0 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.lg-q{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#C9C9D1}
.lg-q span[lang=ar]{font-family:"Noto Kufi Arabic",var(--body);font-size:14px;font-weight:700;color:var(--text)}
.lg-q i{width:4px;height:4px;border-radius:2px;background:var(--gold)}
.lg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lg-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;border-radius:20px;border:1px solid rgba(214,176,76,.45);
  background:linear-gradient(180deg,rgba(214,176,76,.16),rgba(214,176,76,.04));color:var(--text);transition:transform .15s,background .2s}
.lg-btn:active{transform:scale(.97);background:rgba(214,176,76,.24)}
.lg-g{font-family:var(--display);font-size:34px;line-height:1.1;color:var(--gold-2)}

.lg-btn span{font-size:16px;font-weight:700}
/* coach, progress photos, groups */
.lead{padding:0 20px;margin:0;color:#C9C9D1;font-size:14px;line-height:1.55}
.form{padding:16px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.flabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fnote{font-size:12px;color:var(--muted);line-height:1.45}
.err{font-size:12px;color:#FF8F8F}
.field .seg{flex-wrap:wrap;overflow:visible;gap:8px}
.field .seg button{min-height:40px;padding:0 14px;font-size:13px}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal-grid .opt{min-height:56px;padding:10px 12px;gap:10px}
.goal-grid .opt b{font-size:13px;line-height:1.2}
.goal-grid .opt .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(214,176,76,.14);color:var(--gold);flex:none}
.goal-grid .opt.on{border-color:var(--gold);background:rgba(214,176,76,.12)}
.chips,.talk{display:flex;flex-wrap:wrap;gap:8px}
.tchip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--s2);color:#DADAE0;font-size:13px;font-weight:600}
.tchip[aria-pressed=true]{border-color:var(--gold);color:var(--gold-2);background:rgba(214,176,76,.12)}
.plan-h{display:flex;flex-direction:column;gap:4px}
.plan-h b{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;line-height:1.05}
.plan-list{display:flex;flex-direction:column;gap:8px}
.vol{padding:14px;display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:78px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:13px}
.vrow.f span{color:var(--gold-2);font-weight:700}
.vrow b{text-align:end}
.vbar{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.vbar em{position:absolute;top:0;bottom:0;background:rgba(62,213,152,.22)}
.vbar i{position:relative;display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold-3),var(--gold));opacity:.92}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:#D8D8DE}
.tip svg{flex:none;color:var(--gold);margin-top:3px}
.train{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:6px;padding:14px 12px;border-radius:18px;background:var(--s2);border:1px solid var(--line);min-width:0}
.tcard .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(214,176,76,.14);color:var(--gold)}
.tcard b{font-size:13px;line-height:1.25}.tcard .muted{font-size:11.5px;line-height:1.35}
.lb{display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--s2);border:1px solid var(--line)}
.lb-row.me{border-color:var(--gold);background:rgba(214,176,76,.10)}
.lb-n{flex:none;width:22px;display:flex;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--gold-2)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--s3);color:var(--gold-2)}
.lb-row .sc{margin-inline-start:auto}
.nudge{min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);font-size:12px;font-weight:600;color:#DADAE0}
.feed{display:flex;flex-direction:column;gap:8px}
.fi{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);font-size:13px;line-height:1.45}
.fi .av{width:30px;height:30px;font-size:12px}
.fi time{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;border:1px dashed rgba(214,176,76,.5);background:rgba(214,176,76,.06)}
.codebox b{display:block;font-family:var(--display);font-size:22px;letter-spacing:.08em;margin-top:2px}
/* predictions */
.pd-ev{padding:14px;display:flex;flex-direction:column;gap:14px;border-color:#4A3C16}
.pd-stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.pd-stat>div{padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.04)}
.pd-stat span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.pd-stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;color:var(--gold-2);margin-top:4px}
.pd-hint{margin:0;font-size:14px;line-height:1.5;color:#D8D8DE}
.pd-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pd-slot{min-width:0;padding:10px;border-radius:12px;border:1px dashed rgba(214,176,76,.45);display:flex;flex-direction:column;gap:2px}
.pd-slot.f{border-style:solid;background:rgba(214,176,76,.10)}
.pd-slot span{font-size:11px;font-weight:700;color:var(--gold)}
.pd-slot b{font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.pd-list{display:flex;flex-direction:column;gap:8px}
.pd-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border-radius:16px;background:var(--s2);border:1px solid var(--line);color:var(--text);text-align:start}
.pd-row[aria-pressed=true]{border-color:var(--gold);background:rgba(214,176,76,.10)}
.pd-n{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid #4A4A52;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.pd-row[aria-pressed=true] .pd-n{background:var(--gold);border-color:var(--gold);color:#1A1405}
.pd-h{margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pd-out{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04)}
.pd-out.hit{background:rgba(62,213,152,.12)}
.pd-o{flex:none;min-width:34px;font-family:var(--display);font-size:18px;color:var(--gold-2)}
.pd-out .pts{flex:none;font-weight:800;color:var(--gold-2);white-space:nowrap}

/* coming soon */
.soon{padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:linear-gradient(160deg,#2C2310,#18181B 70%);border-color:#4A3C16}
.soon-ic{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold-2);background:radial-gradient(circle at 30% 20%,rgba(241,216,136,.28),rgba(214,176,76,.06));border:1px solid rgba(214,176,76,.35)}
.soon h2{margin:0;font-family:var(--display);font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.soon p{margin:0;font-size:14px;line-height:1.55;color:#D8D8DE;max-width:34ch}
.soon ul{align-self:stretch;display:flex;flex-direction:column;gap:8px;margin:4px 0;text-align:start}
.soon li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);color:#E6E6EA;font-size:14px}
.soon li svg{color:var(--gold);flex:none}
.yt{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stream-none{display:flex;align-items:center;gap:12px;padding:14px 16px;color:var(--gold-2)}
.stream-none b{color:var(--text)}
.cn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cn-btn{min-height:60px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cn-btn b{font-size:16px}.cn-btn span{font-size:12px;color:var(--muted)}
.cn-btn[aria-checked=true]{border-color:var(--gold);background:rgba(214,176,76,.14)}
.cn-btn[aria-checked=true] span{color:var(--gold-2)}
.sp-ph{height:34%}.sp-t{font-size:76px}
@media (max-height:720px){.sp-ph{height:22%}.sp-t{font-size:56px}.lg-btn{min-height:68px!important}.cn-btn{min-height:52px}}
button.link{background:none;border:0;padding:0}

function bodyStats() {
  const b = S.body, w = num(b.weight), h = num(b.height), a = num(b.age), bf = num(b.bf);
  if (!(a >= 15 && a <= 90 && w >= 30 && w <= 250 && h >= 120 && h <= 230)) return null;
  let bmr, method;
  if (bf >= 3 && bf <= 60) { bmr = 370 + 21.6 * w * (1 - bf / 100); method = "Katch-McArdle, which uses your body fat %"; }
  else { bmr = 10 * w + 6.25 * h - 5 * a + (b.sex === "f" ? -161 : 5); method = "Mifflin-St Jeor"; }
  return { w, bmr, tdee: bmr * parseFloat(b.act), method };
}

const lineChart = (pts) => {
  const W = 340, H = 180, L = 40, R = 14, T = 14, B = 28;
  const ws = pts.map((p) => p.w); let lo = Math.min(...ws), hi = Math.max(...ws);
  if (hi - lo < 2) { lo -= 1; hi += 1; } const pd = (hi - lo) * 0.12; lo -= pd; hi += pd;
  const t0 = +new Date(pts[0].d), t1 = +new Date(pts[pts.length - 1].d);
  const x = (d) => (t1 === t0 ? (L + W - R) / 2 : L + ((+new Date(d) - t0) / (t1 - t0)) * (W - L - R));
  const y = (w) => T + (1 - (w - lo) / (hi - lo)) * (H - T - B);
  const ticks = [lo + pd, (lo + hi) / 2, hi - pd];
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(p.d).toFixed(1)} ${y(p.w).toFixed(1)}`).join(" ");
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weight from ${pts[0].w} kg to ${last.w} kg across ${pts.length} entries" style="display:block">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#2B2B30" stroke-width="1"/><text x="${L - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#9B9BA4">${v.toFixed(1)}</text>`).join("")}
    <path d="${path}" fill="none" stroke="#D6B04C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p) => `<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="3.5" fill="#09090A" stroke="#F1D888" stroke-width="2"/>`).join("")}
    <text x="${L}" y="${H - 8}" font-size="10" fill="#9B9BA4">${shortDate(new Date(pts[0].d))}</text>
    <text x="${W - R}" y="${H - 8}" font-size="10" fill="#9B9BA4" text-anchor="end">${shortDate(new Date(last.d))}</text></svg>`;
};

const BFCAT = { m: [[6, "Essential fat"], [14, "Athlete"], [18, "Fitness"], [25, "Average"], [99, "Above average"]], f: [[14, "Essential fat"], [21, "Athlete"], [25, "Fitness"], [32, "Average"], [99, "Above average"]] };
function calcBf() {
  const b = S.body, f = S.fat; const h = num(b.height), nk = num(f.neck), ws = num(f.waist), hp = num(f.hip); const fem = b.sex === "f";
  if (!(h >= 120 && h <= 230 && nk > 20 && ws > 40 && (!fem || hp > 50))) return null;
  const d = fem ? ws + hp - nk : ws - nk; if (d <= 0) return { bad: true };
  const bf = fem ? 495 / (1.29579 - 0.35004 * Math.log10(d) + 0.221 * Math.log10(h)) - 450 : 495 / (1.0324 - 0.19077 * Math.log10(d) + 0.15456 * Math.log10(h)) - 450;
  if (!(bf >= 2 && bf <= 60)) return { bad: true };
  return { bf, cat: BFCAT[fem ? "f" : "m"].find((c) => bf < c[0])[1] };
}

function validate(step) {
  const R = S.reg, d = R.data, er = {};
  if (step === 1 && !d.category) er.category = "Choose a category to continue.";
  if (step === 2) {
    if (!d.name || d.name.trim().length < 3) er.name = "Enter your full name.";
    if (!d.dob) er.dob = "Enter your date of birth.";
    else { const age = (Date.now() - new Date(d.dob).getTime()) / 31557600000; if (!(age >= 18)) er.dob = "Competitors must be 18 or older."; }
    if (!d.nat) er.nat = "Choose your nationality.";
    if (!/^[2569]\d{7}$/.test((d.phone || "").replace(/\s/g, ""))) er.phone = "Enter an 8-digit Kuwait mobile number.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email || "")) er.email = "Enter a valid email address.";
    const h = parseFloat(d.height), w = parseFloat(d.weight);
    if (!(h >= 120 && h <= 230)) er.height = "Enter a height between 120 and 230 cm.";
    if (!(w >= 40 && w <= 200)) er.weight = "Enter a weight between 40 and 200 kg.";
  }
  if (step === 3) {
    if (!d.rules) er.rules = "Accept the rules to continue.";
    if (!d.fit) er.fit = "Confirm you are fit to compete.";
  }
  return er;
}

    fr.onerror = rej; fr.readAsDataURL(file);

}

  gNudge: (v) => { const [id, n] = v.split("|"); const g = S.groups.find((x) => x.id === id); if (!g) return; g.feed.unshift(["You", "nudge:" + n, Date.now()]); persist(); toast("Nudge sent"); },
  gTalk: (v) => { const [id, i] = v.split("|"); const g = S.groups.find((x) => x.id === id); if (!g) return; g.feed.unshift(["You", "msg:" + TALK[+i], Date.now()]); persist(); },
  gCopy: (code) => { try { navigator.clipboard.writeText(code).then(() => toast("Code copied"), () => toast(code)); } catch (e) { toast(code); } },
  gLeave: (v) => { S.gLeave = v || null; },

/* ============ Predictions: pick the top 3 in each division, earn points, compete with friends (sample data) ============ */
const PRED = {
  classic: { list: [["Oliver Grant", "GBR"], ["Rafael Costa", "BRA"], ["Ethan Cole", "CAN"], ["Mats Eriksson", "SWE"], ["Mikael Dahl", "DEN"], ["Ivan Petrov", "BUL"]], result: ["Rafael Costa", "Oliver Grant", "Mats Eriksson"] },
  wellness: { list: [["Nora Whitfield", "GBR"], ["Isabella Moreau", "FRA"], ["Dana Al-Sabah", "KUW"], ["Mia Santos", "BRA"], ["Zara Khan", "UAE"], ["Elena Rossi", "ITA"]], result: ["Isabella Moreau", "Nora Whitfield", "Mia Santos"] }
};
const PD_ORDER = ["classic", "wellness", "open", "physique", "bikini"];
const PD_PTS = [5, 3, 2];
const PD_FR = [["Salem", 8, 7], ["Fahad", 6, 10], ["Yousef", 5, 4], ["Abdullah", 3, 8]]; // name, points so far, points gained when the sample results come in
const pdLock = (c) => ((LIVE[c].when || "").match(/\d\d:\d\d/) || [""])[0];
const pdState = (c) => (PRED[c] ? (S.predOut ? "scored" : "open") : LIVE[c].st === "live" ? "locked" : "final");
const pdPick = (c) => (PRED[c] && Array.isArray(S.picks[c]) ? S.picks[c].filter((n) => PRED[c].list.some((x) => x[0] === n)).slice(0, 3) : []);
const pdPts = (c, i) => { const n = pdPick(c)[i], r = PRED[c].result; return !n ? 0 : r[i] === n ? PD_PTS[i] : r.includes(n) ? 1 : 0; };
const pdDiv = (c) => [0, 1, 2].reduce((t, i) => t + pdPts(c, i), 0);
const pdMine = () => (S.predOut ? Object.keys(PRED).reduce((t, c) => t + pdDiv(c), 0) : 0);
const pdRows = () => [["You", pdMine(), true], ...PD_FR.map(([n, a, b]) => [n, a + (S.predOut ? b : 0), false])].sort((a, b) => b[1] - a[1] || (a[2] ? -1 : b[2] ? 1 : 0));
const pdRank = () => { const r = pdRows(); return [r.findIndex((x) => x[2]) + 1, r.length]; };
const pdDone = () => Object.keys(PRED).filter((c) => pdPick(c).length === 3).length;
SCREENS.predict = () => {
  const e = EV("gulfpro"); const c = PD_ORDER.includes(S.predCat) ? S.predCat : "classic"; const st = pdState(c); const P = PRED[c]; const pick = pdPick(c);
  const cn = CATS.find((x) => x.id === c).name; const [rk, of] = pdRank();
  const chip = st === "open" ? '<span class="chip gold">Open</span>' : st === "locked" ? '<span class="chip live">Locked</span>' : '<span class="chip ok">Final</span>';
  const top3 = (rows) => rows.slice(0, 3).map(([n, cc], i) => `<div class="rowcard"><div class="medal" style="color:${medalColor(i)};border-color:${medalColor(i)}">${i + 1}</div><div style="flex:1;min-width:0;font-weight:600">${esc(n)}</div><span class="muted" style="font-weight:600;font-size:12px">${cc}</span></div>`).join("");
  let body;
  if (st === "open") {
    const left = 3 - pick.length;
    body = `<p class="pd-hint">${left === 3 ? "Tap 3 athletes in the order you think they will finish." : left ? left + " more to pick." : "Your picks are saved. You can change them until " + pdLock(c) + "."}</p>
      <div class="pd-slots" role="group" aria-label="Your top 3">${[0, 1, 2].map((i) => `<div class="pd-slot${pick[i] ? " f" : ""}"><span>${ORD[i]}</span><b>${pick[i] ? esc(pick[i]) : "–"}</b></div>`).join("")}</div>
      <div class="pd-list">${P.list.map(([n, cc]) => { const i = pick.indexOf(n); const rank = RANKS[c].findIndex((r) => r[0] === n) + 1; return `<button class="pd-row" aria-pressed="${i >= 0}" data-act="pick" data-v="${c}|${esc(n)}"><span class="pd-n">${i >= 0 ? i + 1 : ""}</span><span style="flex:1;min-width:0"><b style="display:block;font-size:14px">${esc(n)}</b><span class="muted" style="font-size:12px">${cc}${rank ? " · No. " + rank : ""}</span></span></button>`; }).join("")}</div>
      ${pick.length ? `<button class="btn line sm" style="align-self:flex-start" data-act="predClear" data-v="${c}">${ic("refresh", 16)} Clear picks</button>` : ""}`;
  } else if (st === "scored") {
    body = `<h3 class="pd-h">Result</h3>${top3(P.result.map((n) => P.list.find((x) => x[0] === n)))}
      <h3 class="pd-h">Your picks</h3>${pick.length ? pick.map((n, i) => { const pts = pdPts(c, i), at = P.result.indexOf(n); return `<div class="pd-out${at === i ? " hit" : ""}"><b class="pd-o">${ORD[i]}</b><div style="flex:1;min-width:0"><b style="display:block;font-size:14px">${esc(n)}</b><span class="muted" style="font-size:12px">${at === i ? "Correct" : at >= 0 ? "Finished " + ORD[at] : "Outside the top 3"}</span></div><span class="pts num">+${pts} pts</span></div>`; }).join("") + `<div class="sum" style="padding:6px 2px 0;border:0"><span>This division</span><b class="num">+${pdDiv(c)} pts</b></div>` : fEmpty("You did not pick this division.")}`;
  } else if (st === "locked") {
    body = `${fEmpty("On stage now. Picks are locked.")}<a href="#event-gulfpro" class="btn line block">See live results</a>`;
  } else {
    body = `<p class="pd-hint">This division is final. Picks are closed.</p>${top3(LIVE[c].rows)}`;
  }
  return `
  <div class="scroll view-in"><div class="toolhead"><a href="#home" class="ibtn" aria-label="Back to home">${ic("back")}</a><h1 tabindex="-1" data-focus>Predictions</h1><span style="width:44px"></span></div>
    <p class="lead">Pick the top 3 in each division. You earn points when the results come in.</p>
    <div class="sec"><div class="card pd-ev">
      <a href="#event-gulfpro" class="row" style="gap:12px"><img src="${IMG.ev3}" alt="" style="width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none"><div style="flex:1;min-width:0"><b style="font-size:15px">${esc(e.name)}</b><div class="muted" style="font-size:12px;margin-top:2px">Day 2 · ${esc(e.place)}</div></div><span class="chip live"><i class="dot"></i>Live</span></a>
      <div class="pd-stat"><div><span>Your points</span><b class="num">${pdMine()}</b></div><div><span>Your rank</span><b class="num">${rk} / ${of}</b></div><div><span>Divisions picked</span><b class="num">${pdDone()} / ${Object.keys(PRED).length}</b></div></div>
    </div></div>
    <div class="seg" role="group" aria-label="Division">${PD_ORDER.map((k) => `<button aria-pressed="${c === k}" data-act="predCat" data-v="${k}">${CATS.find((x) => x.id === k).name}</button>`).join("")}</div>
    <div class="sec" style="gap:12px"><div class="row g8" style="flex-wrap:wrap"><b class="disp" style="font-size:22px;text-transform:uppercase;letter-spacing:.03em">${cn}</b>${chip}${st === "open" ? `<span class="muted" style="font-size:12px">Picks lock at ${pdLock(c)}</span>` : ""}</div>${body}</div>
    <div class="sec"><div class="card form" style="gap:12px"><b style="font-size:16px">Try the demo</b><p style="margin:0;font-size:14px;line-height:1.5;color:#D8D8DE">${S.predOut ? "Sample results are in. Open each division to see your points." : "Bring in sample results to see how points and ranking work."}</p>
      ${S.predOut ? `<button class="btn line block" data-act="predReset">${ic("refresh", 18)} Start over</button>` : `<button class="btn gold block" data-act="predReveal">${ic("flame", 18)} Show sample results</button>`}</div></div>
    <div class="sec" style="gap:10px"><div class="sec-h"><h2>Leaderboard</h2><span class="muted" style="font-size:12px">You are ${ordEn(rk)} of ${of}</span></div>
      <div class="lb">${pdRows().map(([n, p, me], i) => `<div class="lb-row${me ? " me" : ""}"><span class="lb-n">${i === 0 ? ic("trophy", 18) : i + 1}</span><span class="av" data-keep>${nm(n).slice(0, 1)}</span><div style="min-width:0"><b>${n}</b></div><div class="sc"><b class="num">${p} pts</b></div></div>`).join("")}</div></div>
    <div class="sec" style="gap:10px"><div class="sec-h"><h2>How points work</h2></div><div class="card" style="padding:6px 16px">${[["Correct winner", 5], ["Correct 2nd place", 3], ["Correct 3rd place", 2], ["In the top 3, wrong place", 1]].map(([l, p]) => `<div class="sum"><span>${l}</span><b class="num">+${p}</b></div>`).join("")}</div></div>
    <div class="sec" style="gap:10px"><div class="sec-h"><h2>Coming up</h2></div><a href="#event-gulfcrown" class="rowcard"><span class="chip gold" style="padding:10px;flex:none">${ic("calendar", 20)}</span><div style="flex:1;min-width:0"><b>${esc(EVENTS[0].name)}</b><div class="muted" style="font-size:12px;margin-top:2px">Predictions open when the start list is published.</div></div>${ic("chev", 18)}</a></div>
    <p class="note" style="padding:0 20px">Demo: athletes, results and friends are sample data. Real predictions need accounts and a server.</p>
  </div>${tabbar("home")}`;
};
Object.assign(ACT, {
  predCat: (v) => { S.predCat = v; },
  pick: (v) => {
    const k = v.indexOf("|"); const c = v.slice(0, k), n = v.slice(k + 1); if (pdState(c) !== "open") return;
    const p = pdPick(c); const i = p.indexOf(n);
    if (i >= 0) p.splice(i, 1); else if (p.length < 3) p.push(n); else { toast("You already picked 3. Tap one to remove it."); return; }
    S.picks[c] = p; persist();
  },
  predClear: (c) => { delete S.picks[c]; persist(); },
  predReveal: () => { if (!Object.keys(PRED).some((c) => pdPick(c).length)) { toast("Make your picks first."); return; } S.predOut = true; persist(); toast("Sample results are in"); },
  predReset: () => { S.predOut = false; S.picks = {}; persist(); }
});

  "Creatine in healthy adults aged 45–65, with and without exercise": "الكرياتين لدى البالغين الأصحاء من 45 إلى 65 سنة، مع التمرين وبدونه",
  "Everyone took 10 g a day of creatine monohydrate or a placebo. Among people who did not train, creatine users gained about 2.4 lb (1.1 kg) of lean tissue and got stronger on leg press and bench press. In the training and diet group, creatine users gained nearly 3 lb (1.4 kg) of lean tissue and lost more body fat percentage than placebo.": "أخذ الجميع 10 غ يوميًا من الكرياتين مونوهيدرات أو دواءً وهميًا. عند غير المتمرنين، زادت الكتلة الصافية لمن أخذوا الكرياتين بحوالي 1.1 كغ وتحسنت قوتهم في دفع الأرجل والبنش برس. وفي مجموعة التمرين والحمية، زادت الكتلة الصافية لمن أخذوا الكرياتين بحوالي 1.4 كغ وخسروا نسبة دهون أكثر من مجموعة الدواء الوهمي.",
  "Creatine can add lean mass and strength, and it works alongside training. This is early evidence from a small study.": "الكرياتين ممكن يزيد الكتلة الصافية والقوة، ويعمل جنبًا إلى جنب مع التمرين. هذه أدلة أولية من دراسة صغيرة.",
  "Protein supplements and gains from resistance training": "مكملات البروتين ومكاسب تمارين المقاومة",
  "Protein supplements gave small extra gains in muscle mass and strength on top of training. The benefit levelled off at about 1.6 g of protein per kg of body weight per day.": "أعطت مكملات البروتين زيادة بسيطة إضافية في الكتلة العضلية والقوة مع التمرين. وتوقفت الفائدة عند حوالي 1.6 غ بروتين لكل كغ من وزن الجسم يوميًا.",
  "Around 1.6 g/kg a day covers most people on average. Some may benefit from a bit more, up to about 2.2 g/kg.": "حوالي 1.6 غ/كغ يوميًا تكفي أغلب الناس في المتوسط، وبعضهم قد يستفيد من أكثر قليلًا حتى حوالي 2.2 غ/كغ.",
  "Weekly training volume and muscle growth": "حجم التمرين الأسبوعي ونمو العضلات",
  "Muscle growth rose as the number of weekly sets per muscle group went up. People doing 10 or more sets a week per muscle gained the most.": "زاد نمو العضلات كلما زاد عدد الجولات الأسبوعية لكل عضلة، وأكثر من استفاد هم من أدّوا 10 جولات أو أكثر أسبوعيًا لكل عضلة.",
  "If growth has stalled, adding a few hard sets per muscle each week is a sensible first step.": "إذا توقف النمو، فإضافة بعض الجولات القوية لكل عضلة أسبوعيًا خطوة أولى منطقية.",

  "Mechanical tension, the load a muscle works against, is considered the main driver of muscle growth.": "الشد الميكانيكي، أي الحمل الذي تعمل العضلة ضده، يُعتبر المحرك الأساسي لنمو العضلات.",

  "On average, the muscle-building benefit of protein levels off near 1.6 g per kg of body weight per day.": "في المتوسط، تتوقف فائدة البروتين لبناء العضلات عند حوالي 1.6 غ لكل كغ من وزن الجسم يوميًا.",

/* ============ Automatic news: when the app is hosted, news.json (written by the news robot) replaces the built-in headlines ============ */
const NEWS_AUTO = { on: false };
const AUTO = { res: [], drama: [] }; // real results and drama headlines from news.json
(async () => {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch("news.json", { cache: "no-cache" });
    if (!r.ok) return;
    const j = await r.json();
    const items = (Array.isArray(j.items) ? j.items : []).filter((x) => x && typeof x.t === "string" && /^https:\/\//.test(x.url || "")).slice(0, 40);
    if (!items.length) return;
    NEWS.length = 0; AUTO.res.length = 0; AUTO.drama.length = 0;
    items.forEach((x) => { const o = { t: x.t, ar: typeof x.ar === "string" ? x.ar : "", url: x.url, src: String(x.src || ""), date: String(x.date || ""), ic: String(x.ic || "news"), local: !!x.local };
      (x.kind === "result" ? AUTO.res : x.kind === "drama" ? AUTO.drama : NEWS).push(o); });
    NEWS_AUTO.on = true;
    if (route()[0] === "home") render(true);
  } catch (e) {}
})();

};

  } catch (e) {}
})();
